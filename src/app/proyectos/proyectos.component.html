<div *ngIf="loading()" class="w-full flex justify-center items-center py-10">
  <span class="text-gray-500">Cargando proyectos...</span>
</div>
<div *ngIf="error()" class="w-full flex justify-center items-center py-10">
  <span class="text-red-500">{{ error() }}</span>
</div>
<div *ngIf="proyectos() && !loading() && !error()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let proyecto of proyectos()" class="bg-white rounded-lg shadow p-6 flex flex-col">
    <img [src]="proyecto.imagen" [alt]="proyecto.nombre" class="w-full h-48 object-cover rounded mb-4">
    <h2 class="text-xl font-bold mb-2">{{ proyecto.nombre }}</h2>
    <p class="mb-2 text-gray-700">{{ proyecto.descripcion }}</p>
    <div class="mb-2">
      <span *ngFor="let tech of proyecto.tecnologias" class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded mr-2 mb-1">{{ tech }}</span>
    </div>
    <a [href]="proyecto.enlace" target="_blank" class="mt-auto text-blue-600 hover:underline">Ver proyecto</a>
  </div>
</div>
