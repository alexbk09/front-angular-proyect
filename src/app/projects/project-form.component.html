<app-toast></app-toast>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 max-w-xl mx-auto" role="form" aria-label="Formulario de proyecto">
  <div *ngIf="loading()" class="animate-pulse text-center py-4">Guardando...</div>
  <div *ngIf="error()" class="text-red-600 text-center py-2">{{ error() }}</div>
  <div>
    <label class="block font-semibold mb-1" for="nombre">Nombre</label>
    <input id="nombre" formControlName="nombre" class="input input-bordered w-full" aria-required="true" aria-label="Nombre del proyecto" />
    <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-red-600 text-xs">El nombre es obligatorio.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="descripcion">Descripción</label>
    <textarea id="descripcion" formControlName="descripcion" class="input input-bordered w-full" aria-required="true" aria-label="Descripción del proyecto"></textarea>
    <div *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched" class="text-red-600 text-xs">La descripción es obligatoria.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="tecnologias">Tecnologías (separadas por coma)</label>
    <input id="tecnologias" formControlName="tecnologias" class="input input-bordered w-full" aria-required="true" aria-label="Tecnologías del proyecto" />
    <div *ngIf="form.get('tecnologias')?.invalid && form.get('tecnologias')?.touched" class="text-red-600 text-xs">Campo obligatorio.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="url">URL</label>
    <input id="url" formControlName="url" class="input input-bordered w-full" aria-required="true" aria-label="URL del proyecto" />
    <div *ngIf="form.get('url')?.invalid && form.get('url')?.touched" class="text-red-600 text-xs">URL inválida.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="imagen">Imagen</label>
    <input id="imagen" type="file" (change)="onFileChange($event)" accept="image/*" aria-label="Imagen del proyecto" />
    <img *ngIf="imagenPreview()" [src]="imagenPreview()" alt="Preview de imagen" class="w-32 h-32 object-cover mt-2 rounded" />
  </div>
  <div class="flex flex-col sm:flex-row gap-4">
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="is_featured" aria-label="Destacado" /> Destacado
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="is_public" aria-label="Público" /> Público
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="is_draft" aria-label="Borrador" /> Borrador
    </label>
  </div>
  <div class="flex flex-col sm:flex-row gap-2 mt-4">
    <button type="button" class="bg-gray-300 text-gray-800 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400" (click)="router.navigate(['../'], { relativeTo: route })" aria-label="Cancelar">Cancelar</button>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" aria-label="Guardar">Guardar</button>
  </div>
</form>
