<section class="container mx-auto py-8 space-y-4">
  <header class="space-y-2 max-w-2xl">
    <p class="text-xs font-semibold tracking-wide text-primary-600 uppercase">Configuración</p>
    <h2 class="text-3xl font-semibold">Preferencias de la aplicación</h2>
    <p class="text-sm text-slate-600 dark:text-slate-300">
      Ajusta el tema y el idioma preferido para tu experiencia en el portafolio.
    </p>
  </header>

  @if (saveMessage) {
    <div
      class="rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-900/30 dark:text-emerald-100"
      role="alert"
      aria-live="polite"
    >
      {{ saveMessage }}
    </div>
  }

  <ui-card title="Preferencias principales">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="space-y-4"
      novalidate
    >
      <div class="grid gap-4 md:grid-cols-2">
        <div class="space-y-1">
          <label for="theme" class="block text-sm font-medium text-slate-900 dark:text-slate-100">
            Tema de la interfaz
          </label>
          <select
            id="theme"
            formControlName="theme"
            class="block w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none transition focus-visible:ring-2 focus-visible:ring-primary-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
          >
            @for (option of themeOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>

        <div class="space-y-1">
          <label for="language" class="block text-sm font-medium text-slate-900 dark:text-slate-100">
            Idioma preferido (ej. es, en)
          </label>
          <input
            id="language"
            type="text"
            maxlength="5"
            formControlName="language"
            class="block w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none transition focus-visible:ring-2 focus-visible:ring-primary-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
          />
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <ui-button
          type="submit"
          variant="primary"
          [label]="isSaving ? 'Guardando…' : 'Guardar preferencias'"
          [attr.aria-busy]="isSaving"
        ></ui-button>
      </div>
    </form>
  </ui-card>
</section>
