<div class="max-w-xl mx-auto">
  <admin-menu></admin-menu>
  <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 bg-white dark:bg-gray-900 rounded-lg shadow space-y-8">
  <h2 class="text-2xl font-bold mb-4">Editar Skills</h2>
  <div formArrayName="skills" class="space-y-4">
    <div *ngFor="let skill of skillsArray.controls; let i = index" [formGroupName]="i" class="flex flex-wrap gap-4 items-end bg-gray-50 dark:bg-gray-800 p-4 rounded-lg shadow-sm">
      <div class="flex-1 min-w-[140px]">
        <label class="block text-sm font-medium mb-1 dark:text-gray-200">Skill</label>
        <input formControlName="name" placeholder="Skill" class="input w-full bg-white dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors" />
      </div>
      <div class="flex-1 min-w-[140px]">
        <label class="block text-sm font-medium mb-1 dark:text-gray-200">Categoría</label>
        <input formControlName="category" placeholder="Categoría" class="input w-full bg-white dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors" />
      </div>
      <div class="w-24">
        <label class="block text-sm font-medium mb-1 dark:text-gray-200">Orden</label>
        <input formControlName="order" type="number" placeholder="Orden" class="input w-full bg-white dark:bg-gray-900 dark:text-white border border-gray-300 dark:border-gray-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors" />
      </div>
      <div class="flex items-center min-w-[120px]">
        <label class="flex items-center gap-2 text-sm dark:text-gray-200">
          <input type="checkbox" formControlName="isFeatured" class="accent-primary-600" /> Destacada
        </label>
      </div>
      <button type="button" (click)="removeSkill(i)" class="btn btn-danger ml-2">Quitar</button>
    </div>
  </div>
  <button type="button" (click)="addSkill()" class="btn btn-primary mt-2">Agregar Skill</button>
  <div class="flex gap-4 items-center mt-4">
    <button type="submit" [disabled]="loading()" class="btn btn-success">
      <span *ngIf="!loading()">Guardar</span>
      <span *ngIf="loading()" class="animate-spin">⏳</span>
    </button>
    <span *ngIf="success()" class="text-green-600 animate-fade-in">¡Guardado!</span>
    <span *ngIf="error()" class="text-red-600">{{ error() }}</span>
  </div>
</form>
