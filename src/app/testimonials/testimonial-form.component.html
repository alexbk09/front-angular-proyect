<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 max-w-xl mx-auto" role="form" aria-label="Formulario de testimonio">
  <div *ngIf="loading()" class="animate-pulse text-center py-4">Guardando...</div>
  <div *ngIf="error()" class="text-red-600 text-center py-2">{{ error() }}</div>
  <div>
    <label class="block font-semibold mb-1" for="nombre">Nombre</label>
    <input id="nombre" formControlName="nombre" class="input input-bordered w-full" aria-required="true" aria-label="Nombre del testimonio" />
    <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-red-600 text-xs">El nombre es obligatorio.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="cargo">Cargo</label>
    <input id="cargo" formControlName="cargo" class="input input-bordered w-full" aria-required="true" aria-label="Cargo del testimonio" />
    <div *ngIf="form.get('cargo')?.invalid && form.get('cargo')?.touched" class="text-red-600 text-xs">El cargo es obligatorio.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="mensaje">Mensaje</label>
    <textarea id="mensaje" formControlName="mensaje" class="input input-bordered w-full" aria-required="true" aria-label="Mensaje del testimonio"></textarea>
    <div *ngIf="form.get('mensaje')?.invalid && form.get('mensaje')?.touched" class="text-red-600 text-xs">El mensaje es obligatorio.</div>
  </div>
  <div>
    <label class="block font-semibold mb-1" for="imagen">Imagen</label>
    <input id="imagen" type="file" (change)="onFileChange($event)" accept="image/*" aria-label="Imagen del testimonio" />
    <img *ngIf="imagenPreview()" [src]="imagenPreview()" alt="Preview de imagen" class="w-24 h-24 object-cover mt-2 rounded-full mx-auto" />
  </div>
  <div class="flex flex-col sm:flex-row gap-4">
    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="is_public" aria-label="Público" /> Público
    </label>
  </div>
  <div class="flex flex-col sm:flex-row gap-2 mt-4">
    <button type="button" class="bg-gray-300 text-gray-800 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400" (click)="router.navigate(['../'], { relativeTo: route })" aria-label="Cancelar">Cancelar</button>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" aria-label="Guardar">Guardar</button>
  </div>
</form>
