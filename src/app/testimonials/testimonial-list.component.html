<app-toast></app-toast>
<div class="flex flex-col sm:flex-row justify-end mb-4">
  <button class="bg-blue-600 dark:bg-blue-500 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 dark:focus:ring-blue-300 transition-colors duration-200" (click)="irANuevo()" aria-label="Crear nuevo testimonio">Nuevo Testimonio</button>
</div>
<div *ngIf="loading()" class="animate-pulse text-center py-8 text-gray-700 dark:text-gray-200">Cargando testimonios...</div>
<div *ngIf="error()" class="text-red-600 dark:text-red-400 text-center py-4">{{ error() }}</div>
<div *ngIf="!loading() && testimonios().length === 0" class="text-center py-8 text-gray-500 dark:text-gray-400">
  No hay testimonios registrados.
</div>
<div *ngIf="!loading() && testimonios().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" role="list">
  <div *ngFor="let testimonio of testimonios()" class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 flex flex-col gap-2 border border-gray-100 dark:border-gray-700 transition-colors duration-200" tabindex="0" role="listitem" aria-label="Testimonio de {{ testimonio.nombre }}">
    <img *ngIf="testimonio.imagen" [src]="testimonio.imagen" alt="Foto de {{ testimonio.nombre }}" class="rounded-full w-20 h-20 object-cover mx-auto mb-2 border-2 border-primary-500 dark:border-primary-400" />
    <h3 class="font-bold text-lg text-center text-gray-900 dark:text-gray-100">{{ testimonio.nombre }}</h3>
    <p class="text-gray-500 dark:text-gray-300 text-center text-sm">{{ testimonio.cargo }}</p>
    <blockquote class="italic text-center my-2 text-gray-700 dark:text-gray-200">{{ testimonio.mensaje }}</blockquote>
    <div class="flex gap-2 justify-center mt-2">
      <button class="bg-yellow-500 dark:bg-yellow-600 text-white px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400 dark:focus:ring-yellow-300 transition-colors duration-200" (click)="irAEditar(testimonio)" aria-label="Editar testimonio de {{ testimonio.nombre }}">Editar</button>
      <button class="bg-red-600 dark:bg-red-500 text-white px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-red-400 dark:focus:ring-red-300 transition-colors duration-200" (click)="confirmarEliminar(testimonio)" aria-label="Eliminar testimonio de {{ testimonio.nombre }}">Eliminar</button>
    </div>
    <div class="flex gap-1 justify-center mt-2">
      <span *ngIf="!testimonio.is_public" class="bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 px-2 py-1 rounded text-xs">No pblico</span>
    </div>
  </div>
</div>
<app-testimonial-delete-dialog *ngIf="testimonioAEliminar" (confirm)="eliminarTestimonio()" (cancel)="cancelarEliminar()"></app-testimonial-delete-dialog>
