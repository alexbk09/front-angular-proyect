<div class="flex flex-col sm:flex-row justify-end mb-4">
  <button class="bg-blue-600 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" (click)="irANuevo()" aria-label="Crear nuevo testimonio">Nuevo Testimonio</button>
</div>
<div *ngIf="loading()" class="animate-pulse text-center py-8">Cargando testimonios...</div>
<div *ngIf="error()" class="text-red-600 text-center py-4">{{ error() }}</div>
<div *ngIf="!loading() && testimonios().length === 0" class="text-center py-8 text-gray-500">
  No hay testimonios registrados.
</div>
<div *ngIf="!loading() && testimonios().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" role="list">
  <div *ngFor="let testimonio of testimonios()" class="bg-white rounded-lg shadow p-4 flex flex-col gap-2" tabindex="0" role="listitem" aria-label="Testimonio de {{ testimonio.nombre }}">
    <img *ngIf="testimonio.imagen" [src]="testimonio.imagen" alt="Foto de {{ testimonio.nombre }}" class="rounded-full w-20 h-20 object-cover mx-auto mb-2" />
    <h3 class="font-bold text-lg text-center">{{ testimonio.nombre }}</h3>
    <p class="text-gray-500 text-center text-sm">{{ testimonio.cargo }}</p>
    <blockquote class="italic text-center my-2">“{{ testimonio.mensaje }}”</blockquote>
    <div class="flex gap-2 justify-center mt-2">
      <button class="bg-yellow-500 text-white px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400" (click)="irAEditar(testimonio)" aria-label="Editar testimonio de {{ testimonio.nombre }}">Editar</button>
      <button class="bg-red-600 text-white px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-red-400" (click)="confirmarEliminar(testimonio)" aria-label="Eliminar testimonio de {{ testimonio.nombre }}">Eliminar</button>
    </div>
    <div class="flex gap-1 justify-center mt-2">
      <span *ngIf="!testimonio.is_public" class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs">No público</span>
    </div>
  </div>
</div>
<app-testimonial-delete-dialog *ngIf="testimonioAEliminar" (confirm)="eliminarTestimonio()" (cancel)="cancelarEliminar()"></app-testimonial-delete-dialog>
