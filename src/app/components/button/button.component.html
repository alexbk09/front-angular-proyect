<button
  type="button"
  class="inline-flex items-center justify-center gap-1 rounded-lg border text-sm font-medium px-4 py-2 shadow-sm transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-50 dark:focus-visible:ring-offset-slate-950"
  [ngClass]="{
    'bg-primary-600 text-white border-primary-700 hover:bg-primary-700 hover:shadow-soft': variant === 'primary',
    'bg-secondary text-white border-secondary hover:bg-teal-600 hover:shadow-soft': variant === 'secondary',
    'bg-slate-100 text-slate-900 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-100 dark:border-slate-700 dark:hover:bg-slate-700': variant === 'default'
  }"
>
  {{ label }}
</button>
