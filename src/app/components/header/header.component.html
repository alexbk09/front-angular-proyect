<header class="header bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
  <div class="container flex items-center justify-between py-3">
    <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Front Angular Proyect</h1>
    <nav class="flex items-center gap-4">
      <a routerLink="/" aria-label="Inicio" class="text-gray-700 dark:text-gray-200 hover:text-primary-600">Inicio</a>
      <button (click)="toggleTheme()" class="px-3 py-1.5 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-700 hover:bg-gray-200 dark:hover:bg-gray-700">
        {{ isDark() ? 'Light' : 'Dark' }}
      </button>
    </nav>
  </div>
</header>
